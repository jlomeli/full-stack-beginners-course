<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Pancake gallery</title>
		<link rel="stylesheet" href="02-grid.css" />
	</head>
	<body>
		<main>
			<h1>Pancake gallery</h1>
			<ul class="gallery">
				<li class="tile tile-wide">
					<div class="swatch" style="background-color: #f59e0b"></div>
					<h2>Classic stack</h2>
				</li>
				<li class="tile">
					<div class="swatch" style="background-color: #b45309"></div>
					<h2>Chocolate chip</h2>
				</li>
				<li class="tile">
					<div class="swatch" style="background-color: #1d4ed8"></div>
					<h2>Blueberry</h2>
				</li>
				<li class="tile">
					<div class="swatch" style="background-color: #be123c"></div>
					<h2>Strawberry</h2>
				</li>
				<li class="tile">
					<div class="swatch" style="background-color: #15803d"></div>
					<h2>Matcha</h2>
				</li>
				<li class="tile">
					<div class="swatch" style="background-color: #7c3aed"></div>
					<h2>Ube</h2>
				</li>
				<li class="tile">
					<div class="swatch" style="background-color: #0f766e"></div>
					<h2>Pandan</h2>
				</li>
			</ul>
		</main>
	</body>
</html>
